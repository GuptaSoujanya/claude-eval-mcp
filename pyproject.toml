[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-eval-mcp"
version = "0.2.6"
description = "Model Context Protocol (MCP) server exposing AI evaluation, latency profiling, and security auditing tools directly to Claude."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "158287001+GuptaSoujanya@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
claude-eval-mcp = "claude_eval.server:main"
